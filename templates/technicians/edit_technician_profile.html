{% extends "base.html" %}
{% block title %}Edit technician profile{% endblock %}
{% block content %}
<div class="card form-card wide">
<h1 style="font-size:30px">Edit technician profile</h1>
<form method="post" enctype="multipart/form-data">
{% csrf_token %}
{% include "includes/form_fields.html" %}
<button class="btn" type="submit">Save changes</button>
<a class="btn alt" href="{% url 'technicians:my_technician_profile' %}">Cancel</a>
</form>
</div>
{% endblock %}
{% block scripts %}
<link href="https://cdn.jsdelivr.net/npm/tom-select@2.4.3/dist/css/tom-select.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/tom-select@2.4.3/dist/js/tom-select.complete.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  ['id_categories', 'id_base_locations'].forEach(function (id) {
    var el = document.getElementById(id);
    if (el && window.TomSelect) {
      new TomSelect(el, {plugins: ['remove_button'], maxOptions: 100});
    }
  });
});
</script>
{% endblock %}
