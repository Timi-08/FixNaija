{% extends "base.html" %}
{% block title %}Create a service{% endblock %}
{% block content %}
<div class="card form-card wide">
<h1 style="font-size:30px">Create a service listing</h1>
<form method="post">
{% csrf_token %}
{% include "includes/form_fields.html" %}
<button class="btn" type="submit">Create listing</button>
<a class="btn alt" href="{% url 'technicians:my_services' %}">Cancel</a>
</form>
</div>
{% endblock %}
{% block scripts %}
<link href="https://cdn.jsdelivr.net/npm/tom-select@2.4.3/dist/css/tom-select.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/tom-select@2.4.3/dist/js/tom-select.complete.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  var el = document.getElementById('id_service_areas');
  if (el && window.TomSelect) {
    new TomSelect(el, {plugins: ['remove_button'], placeholder: 'Search and select service areas...', maxOptions: 100});
  }
});
</script>
{% endblock %}
