
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Service | FixNaija</title>
</head>
<body>
    <h1>Delete Service</h1>

    <p>Are you sure you want to delete "{{ listing.title }}"?</p>
    <p>This service will no longer appear in public listings.</p>

    <form method="POST">
        {% csrf_token %}
        <button type="submit">Yes, Delete Service</button>
    </form>

    <a href="{% url 'technicians:my_services' %}">Cancel</a>
</body>
</html>
