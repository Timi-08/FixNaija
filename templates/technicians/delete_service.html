{% extends "base.html" %}
{% block title %}Delete service{% endblock %}
{% block content %}
<div class="card form-card">
<h1 style="font-size:30px">Delete service</h1>
<p>Are you sure you want to delete "{{ listing.title }}"?</p>
<p class="mute">This service will no longer appear in public listings.</p>
<form method="post">
{% csrf_token %}
<button class="btn bad" type="submit">Yes, delete service</button>
<a class="btn alt" href="{% url 'technicians:my_services' %}">Cancel</a>
</form>
</div>
{% endblock %}
