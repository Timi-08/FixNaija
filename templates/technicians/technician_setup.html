
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Become a Technician | FixNaija</title>
</head>
<body>
    <h1>Become a Technician on FixNaija</h1>

    <p>
        Tell customers about your skills and the services you offer.
        Complete the form below to create your technician profile.
    </p>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Create Technician Profile</button>
    </form>
</body>
</html>
