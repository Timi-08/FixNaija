
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Service | FixNaija</title>

    <link
        href="https://cdn.jsdelivr.net/npm/tom-select@2.4.3/dist/css/tom-select.css"
        rel="stylesheet"
    >
</head>
<body>
    <h1>Edit Service: {{ listing.title }}</h1>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit">Save Changes</button>
    </form>

    <a href="{% url 'technicians:my_services' %}">Cancel</a>

    <script src="https://cdn.jsdelivr.net/npm/tom-select@2.4.3/dist/js/tom-select.complete.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const serviceAreas = document.getElementById('id_service_areas');

            if (serviceAreas) {
                new TomSelect(serviceAreas, {
                    plugins: ['remove_button'],
                    placeholder: 'Select service areas'
                });
            }
        });
    </script>
</body>
</html>
