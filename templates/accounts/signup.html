{% extends "base.html" %}
{% block title %}Create account{% endblock %}
{% block content %}
<div class="card form-card">
<h1 style="font-size:30px">Create your FixNaija account</h1>
<p class="mute">One account lets you book technicians and offer your own services.</p>
<form method="post">
{% csrf_token %}
{% include "includes/form_fields.html" %}
<button class="btn" type="submit">Create account</button>
</form>
<p class="mute" style="margin-top:16px">Already registered? <a href="{% url 'accounts:login' %}">Sign in</a></p>
</div>
{% endblock %}
