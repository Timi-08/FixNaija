{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="card form-card">
<h1 style="font-size:30px">Sign in to FixNaija</h1>
<form method="post">
{% csrf_token %}
{% include "includes/form_fields.html" %}
<input type="hidden" name="next" value="{{ next }}">
<button class="btn" type="submit">Sign in</button>
</form>
<p class="mute" style="margin-top:16px">New to FixNaija? <a href="{% url 'accounts:signup' %}">Create an account</a></p>
</div>
{% endblock %}
